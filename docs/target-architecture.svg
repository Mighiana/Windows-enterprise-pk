<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="770" viewBox="0 0 1200 770" font-family="'DejaVu Sans Mono', Consolas, 'JetBrains Mono', monospace">
  <title>Target production design (not implemented): two-tier AD CS PKI</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#111"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0a7d3e"/></marker>
    <style>
      .box{fill:#fff;stroke:#111;stroke-width:1.6} .key{fill:#fff;stroke:#111;stroke-width:2.6} .ok{fill:#f2faf5;stroke:#0a7d3e;stroke-width:2.2}
      .h{font-size:15px;font-weight:700;fill:#111} .t{font-size:12.5px;fill:#222} .m{font-size:11.5px;fill:#666}
      .tag{font-size:10.5px;fill:#666;letter-spacing:1.5px} .lbl{font-size:11.5px;fill:#111;font-weight:700}
      .ln{fill:none;stroke:#111;stroke-width:1.6} .lg{fill:none;stroke:#0a7d3e;stroke-width:2}
    </style>
  </defs>
  <rect width="1200" height="770" fill="#fafafa"/>
  <text x="30" y="44" class="h" font-size="20">TARGET PRODUCTION DESIGN · TWO-TIER AD CS</text>
  <rect x="30" y="56" width="372" height="22" fill="#111"/>
  <text x="40" y="72" font-size="12" fill="#fff" font-weight="700">DESIGN ONLY · NOT IMPLEMENTED · 2026</text>
  <text x="414" y="72" class="m">how the single-VM lab (one Enterprise Root CA on the DC) would be built for production</text>
    <rect x="30" y="100" width="330" height="175" class="key"/>
  <text x="44" y="122" class="tag">TIER 0 · OFFLINE</text>
  <text x="44" y="144" class="h">Standalone Root CA</text>
  <text x="44" y="168" class="t">IRB-Root-CA (not domain-joined)</text>
  <text x="44" y="187" class="t">powered off between ceremonies</text>
  <text x="44" y="206" class="t">key in HSM, 2-person rule</text>
  <text x="44" y="225" class="t">validity 20 y · CRL every 6 months</text>
  <text x="44" y="244" class="t">signs the issuing CA only</text>
  <rect x="435" y="100" width="330" height="175" class="key"/>
  <text x="449" y="122" class="tag">TIER 0 · ONLINE</text>
  <text x="449" y="144" class="h">Enterprise Issuing CA</text>
  <text x="449" y="168" class="t">IRB-Issuing-CA01 (subordinate)</text>
  <text x="449" y="187" class="t">HSM-backed key · validity 10 y</text>
  <text x="449" y="206" class="t">CRL 7 d + delta CRL 1 d</text>
  <text x="449" y="225" class="t">CA auditing on (events 4886-4900)</text>
  <text x="449" y="244" class="t">publishes hardened templates only</text>
  <rect x="840" y="100" width="330" height="175" class="box"/>
  <text x="854" y="122" class="tag">REVOCATION · AIA</text>
  <text x="854" y="144" class="h">HTTP CDP + OCSP</text>
  <text x="854" y="168" class="t">http://pki.irb.local/crl/</text>
  <text x="854" y="187" class="t">http://pki.irb.local/aia/</text>
  <text x="854" y="206" class="t">Online Responder (OCSP)</text>
  <text x="854" y="225" class="t">OCSP signing cert auto-renews</text>
  <text x="854" y="244" class="t">reachable by every relying party</text>
  <rect x="30" y="345" width="330" height="160" class="box"/>
  <text x="44" y="367" class="tag">GROUP POLICY</text>
  <text x="44" y="389" class="h">Trust + autoenrollment</text>
  <text x="44" y="413" class="t">root + issuing chain to all hosts</text>
  <text x="44" y="432" class="t">NTAuth store controlled</text>
  <text x="44" y="451" class="t">GPO edit rights: Tier 0 only</text>
  <text x="44" y="470" class="t">autoenrollment enabled</text>
  <rect x="435" y="345" width="330" height="160" class="ok"/>
  <text x="449" y="367" class="tag">TEMPLATES · HARDENED</text>
  <text x="449" y="389" class="h">No ESC1-ESC8 paths</text>
  <text x="449" y="413" class="t">WebServer-IRB: Server Auth only</text>
  <text x="449" y="432" class="t">subject built from AD, no SAN input</text>
  <text x="449" y="451" class="t">enroll: "Web Servers" group</text>
  <text x="449" y="470" class="t">audit-adcs.ps1 on schedule = gate</text>
  <rect x="840" y="345" width="330" height="160" class="box"/>
  <text x="854" y="367" class="tag">RELYING PARTIES</text>
  <text x="854" y="389" class="h">Servers + separate clients</text>
  <text x="854" y="413" class="t">IIS: TLS 1.2+, HTTP→HTTPS, HSTS</text>
  <text x="854" y="432" class="t">domain clients on other hosts</text>
  <text x="854" y="451" class="t">chain + revocation validated</text>
  <text x="854" y="470" class="t">verify-pki.ps1 -CheckRevocation</text>
  <path d="M360,187 L433,187" class="ln" marker-end="url(#a)"/>
  <text x="372" y="178" class="lbl">signs</text>
  <path d="M765,187 L838,187" class="ln" marker-end="url(#a)"/>
  <text x="770" y="178" class="lbl">publishes</text>
  <path d="M600,275 L600,343" class="lg" marker-end="url(#g)"/>
  <text x="610" y="315" class="lbl">issues from</text>
  <path d="M1005,275 L1005,343" class="ln" marker-end="url(#a)"/>
  <text x="1015" y="315" class="lbl">CRL / OCSP checks</text>
  <path d="M765,425 L838,425" class="lg" marker-end="url(#g)"/>
  <text x="768" y="416" class="lbl">enroll</text>
  <path d="M195,505 L195,545 L1005,545 L1005,507" class="ln" marker-end="url(#a)"/>
  <text x="520" y="538" class="lbl">trust chain + autoenrollment policy via GPO</text>
  <rect x="30" y="580" width="1140" height="96" class="box"/>
  <text x="44" y="602" class="tag">MONITORING · DETECTION</text>
  <text x="44" y="626" class="t">CA events 4886 request · 4887 issued · 4888 denied · 4899/4900 template changed → SIEM</text>
  <text x="44" y="646" class="t">alert on: SAN ≠ requester, new template published, EditFlags change, cert for privileged account</text>
  <text x="44" y="666" class="t">expiry + chain health: verify-pki.ps1 -OutputFormat Json on a schedule (ATT&amp;CK T1649, T1553.004, T1557)</text>
  <text x="30" y="722" class="m">Lab → target: single-tier root on the DC → offline root + issuing CA · no CDP/OCSP → HTTP CDP + OCSP · manual certreq → autoenrollment</text>
  <text x="30" y="742" class="m">same-host browser check → separate relying parties · software CA key → HSM · no template review → scheduled ESC audit</text>
</svg>